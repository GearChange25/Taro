<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shivutaro</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(190, 230, 255, 0.45),
            transparent 25%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(255, 220, 235, 0.45),
            transparent 30%
        ),
        #f5fbff;

    overflow-x: hidden;
    color: #253746;
}


/* =====================================================
   FALLING FLOWERS
===================================================== */

.flowers {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}

.flower-fall {
    position: absolute;

    top: -60px;

    width: 35px;

    opacity: 0.65;

    animation:
        fall linear forwards,
        sway ease-in-out infinite alternate;

    filter:
        drop-shadow(
            0 0 5px rgba(0, 0, 0, 0.12)
        );
}

@keyframes fall {

    0% {
        transform:
            translateY(0)
            translateX(0)
            rotate(0deg);
    }

    100% {
        transform:
            translateY(110vh)
            translateX(80px)
            rotate(360deg);
    }

}

@keyframes sway {

    from {
        margin-left: -30px;
    }

    to {
        margin-left: 30px;
    }

}


/* =====================================================
   NAVBAR
===================================================== */

.topbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 22px;

    background:
        rgba(255, 255, 255, 0.88);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    border-bottom:
        1px solid rgba(170, 210, 230, 0.35);

    box-shadow:
        0 3px 18px rgba(0, 0, 0, 0.06);

    z-index: 1000;
}


/* LOGO */

.logo {

    display: flex;

    align-items: center;

    gap: 9px;

    font-weight: 700;

    font-size: 20px;

    color: #253f52;

    cursor: pointer;

}

.logo-img {

    width: 46px;
    height: 46px;

    object-fit: contain;

    border-radius: 10px;

    filter:
        drop-shadow(
            0 4px 7px
            rgba(0, 0, 0, 0.10)
        );

}


/* =====================================================
   HAMBURGER BUTTON
===================================================== */

.menu-button {

    width: 45px;
    height: 45px;

    border: none;

    border-radius: 12px;

    background:
        rgba(220, 242, 255, 0.8);

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 5px;

    transition:
        0.25s ease;

}

.menu-button span {

    width: 23px;

    height: 2.5px;

    border-radius: 5px;

    background: #35576d;

    transition:
        0.3s ease;

}

.menu-button:hover {

    background: #c7e9fa;

    transform:
        translateY(-1px);

}


/* Hamburger transforms into X */

.menu-button.active span:nth-child(1) {

    transform:
        translateY(7.5px)
        rotate(45deg);

}

.menu-button.active span:nth-child(2) {

    opacity: 0;

}

.menu-button.active span:nth-child(3) {

    transform:
        translateY(-7.5px)
        rotate(-45deg);

}


/* =====================================================
   DROPDOWN MENU
===================================================== */

.menu {

    position: fixed;

    top: 82px;

    right: 18px;

    width: 245px;

    background:
        rgba(255, 255, 255, 0.96);

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    border:
        1px solid rgba(180, 215, 230, 0.5);

    border-radius: 18px;

    padding: 10px;

    box-shadow:
        0 20px 45px
        rgba(40, 70, 90, 0.16);

    z-index: 999;

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(-12px)
        scale(0.96);

    transform-origin:
        top right;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        visibility 0.25s ease;

}

.menu.show {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0)
        scale(1);

}


/* MENU ITEMS */

.menu a {

    display: flex;

    align-items: center;

    gap: 13px;

    padding:
        13px 14px;

    margin:
        3px 0;

    border-radius: 12px;

    text-decoration: none;

    color: #354b5b;

    font-size: 15px;

    transition:
        0.2s ease;

}

.menu a:hover {

    background:
        #eef8fd;

    color:
        #1d648c;

    transform:
        translateX(3px);

}

.menu-icon {

    width: 27px;

    text-align: center;

    font-size: 19px;

}


/* =====================================================
   TITLE
===================================================== */

.title {

    position: relative;

    z-index: 2;

    margin-top: 105px;

    text-align: center;

    font-size: 22px;

    font-weight: 600;

    color: #304b5d;

}


/* =====================================================
   CAROUSEL
===================================================== */

.wrapper {

    position: relative;

    z-index: 2;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 70vh;

}

.carousel {

    width: 90%;

    max-width: 340px;

    overflow: hidden;

    border-radius: 25px;

    background: white;

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.15);

}

.slides {

    display: flex;

    transition:
        transform 0.4s ease;

}

.slide {

    min-width: 100%;

}

.slide img {

    width: 100%;

    height: 420px;

    object-fit: cover;

}


/* =====================================================
   DOTS
===================================================== */

.dots {

    text-align: center;

    padding: 10px 0;

}

.dot {

    height: 8px;

    width: 8px;

    margin: 4px;

    display: inline-block;

    border-radius: 50%;

    background: #ccc;

    transition:
        0.3s;

    cursor: pointer;

}

.dot.active {

    background: #333;

    transform:
        scale(1.3);

}


/* =====================================================
   FLOATING SORRY CAT
===================================================== */

.sorry-cat {

    position: fixed;

    right: 22px;

    bottom: 25px;

    width: 105px;

    height: 105px;

    z-index: 800;

    cursor: pointer;

    animation:
        sorryFloat 3.5s
        ease-in-out infinite;

}


/* CAT IMAGE */

.sorry-cat img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0, 0, 0, 0.18)
        );

    transition:
        transform 0.25s ease;

}

.sorry-cat:hover img {

    transform:
        scale(1.1)
        rotate(-4deg);

}


/* =====================================================
   SORRY SPEECH BUBBLE
===================================================== */

.sorry-bubble {

    position: absolute;

    right: 82px;

    bottom: 72px;

    width: 125px;

    padding:
        9px 12px;

    background: white;

    border-radius: 14px;

    color: #714957;

    font-size: 13px;

    font-weight: 600;

    text-align: center;

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.13);

    opacity: 0;

    transform:
        translateY(8px)
        scale(0.9);

    pointer-events: none;

    transition:
        0.3s ease;

}


/* Little bubble tail */

.sorry-bubble::after {

    content: "";

    position: absolute;

    right: -8px;

    bottom: 13px;

    width: 16px;

    height: 16px;

    background: white;

    transform:
        rotate(45deg);

}


/* Show bubble on hover */

.sorry-cat:hover .sorry-bubble {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

}


@keyframes sorryFloat {

    0% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-12px);
    }

    100% {
        transform:
            translateY(0);
    }

}


/* =====================================================
   CAT POPUP
===================================================== */

.cat-popup {

    position: fixed;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.35);

    display: none;

    justify-content: center;

    align-items: center;

    z-index: 2000;

}

.popup-box {

    background: white;

    padding: 25px;

    border-radius: 18px;

    text-align: center;

    width: 280px;

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.2);

    animation:
        pop 0.3s ease;

}

@keyframes pop {

    from {

        transform:
            scale(0.8);

        opacity: 0;

    }

    to {

        transform:
            scale(1);

        opacity: 1;

    }

}

.btn-row {

    margin-top: 15px;

    display: flex;

    justify-content: space-around;

}

.yes-btn,
.no-btn {

    padding:
        8px 18px;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

}

.yes-btn {

    background:
        #bfe6ff;

    color:
        #12324a;

}

.no-btn {

    background:
        #ffd6d6;

    color:
        #a30000;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .topbar {

        height: 65px;

        padding:
            0 14px;

    }

    .logo-img {

        width: 40px;
        height: 40px;

    }

    .logo {

        font-size: 18px;

    }

    .menu {

        top: 75px;

        right: 12px;

        width:
            calc(100% - 24px);

    }

    .title {

        margin-top: 92px;

        font-size: 19px;

    }

    .wrapper {

        min-height:
            72vh;

    }

    .carousel {

        max-width:
            330px;

    }

    .slide img {

        height:
            400px;

    }

    .sorry-cat {

        width: 82px;

        height: 82px;

        right: 13px;

        bottom: 18px;

    }

    .sorry-bubble {

        right: 65px;

        bottom: 60px;

        width: 105px;

        font-size: 11px;

    }

}

</style>
</head>


<body>


<!-- =====================================================
     FALLING FLOWERS
===================================================== -->

<div
    class="flowers"
    id="flowers">
</div>



<!-- =====================================================
     TOP NAVBAR
===================================================== -->

<header class="topbar">


    <!-- LOGO / BRAND -->

    <div class="logo">

        <img
            src="logo.png"
            class="logo-img"
            alt="Shivutaro">

        <span>
            Shivutaro
        </span>

    </div>



    <!-- HAMBURGER -->

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu">

        <span></span>
        <span></span>
        <span></span>

    </button>


</header>



<!-- =====================================================
     DROPDOWN MENU
===================================================== -->

<nav
    class="menu"
    id="menu">


    <a href="index.html">

        <span class="menu-icon">
            🏠
        </span>

        <span>
            Home
        </span>

    </a>


    <a href="gallery.html">

        <span class="menu-icon">
            🖼️
        </span>

        <span>
            Gallery
        </span>

    </a>


    <a href="index2.html">

        <span class="menu-icon">
            💌
        </span>

        <span>
            Message
        </span>

    </a>


    <a href="sorry.html">

        <span class="menu-icon">
            🥺
        </span>

        <span>
            I'm Sorry
        </span>

    </a>


    <a href="imp.html">

        <span class="menu-icon">
            🔔
        </span>

        <span>
            Alerts
        </span>

    </a>


    <a href="billimart.html">

        <span class="menu-icon">
            🧠
        </span>

        <span>
            Billi Mart
        </span>

    </a>


</nav>



<!-- =====================================================
     TITLE
===================================================== -->

<div class="title">

    Welcome My Madamji 🤍🐱

</div>



<!-- =====================================================
     CAROUSEL
===================================================== -->

<div class="wrapper">


    <div
        class="carousel"
        id="carousel">


        <div
            class="slides"
            id="slides">


            <div class="slide">

                <img
                    src="4.jpeg"
                    alt="Memory">

            </div>


            <div class="slide">

                <img
                    src="5.jpeg"
                    alt="Memory">

            </div>


            <div class="slide">

                <img
                    src="3.jpeg"
                    alt="Memory">

            </div>


        </div>



        <!-- DOTS -->

        <div class="dots">


            <span
                class="dot active"
                onclick="go(0)">
            </span>


            <span
                class="dot"
                onclick="go(1)">
            </span>


            <span
                class="dot"
                onclick="go(2)">
            </span>


        </div>


    </div>

</div>



<!-- =====================================================
     SORRY CAT
===================================================== -->

<div
    class="sorry-cat"
    onclick="openSorryPage()">


    <div class="sorry-bubble">

        I'm sorry, Madamji 🥺🤍

    </div>


    <img
        src="cat6.jpg"
        alt="Sorry cat">


</div>



<!-- =====================================================
     EXISTING CAT
===================================================== -->

<div
    class="cat-popup"
    id="catPopup">


    <div class="popup-box">


        <h2>
            Is it a yes Shivi? 🐱
        </h2>


        <div class="btn-row">


            <button
                class="yes-btn"
                onclick="chooseYes()">

                Yes

            </button>


            <button
                class="no-btn"
                onclick="chooseNo()">

                No

            </button>


        </div>


    </div>

</div>



<script>


/* =====================================================
   HAMBURGER MENU
===================================================== */

const menuButton =
    document.getElementById(
        "menuButton"
    );

const menu =
    document.getElementById(
        "menu"
    );


/*
   Open / close menu.
*/

menuButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        menu.classList.toggle(
            "show"
        );

        menuButton.classList.toggle(
            "active"
        );

    }
);


/*
   Close menu when clicking
   somewhere else.
*/

document.addEventListener(
    "click",
    function(event) {

        if (
            !menu.contains(event.target) &&
            !menuButton.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

            menuButton.classList.remove(
                "active"
            );

        }

    }
);



/* =====================================================
   CAROUSEL
===================================================== */

let index = 0;


const slides =
    document.getElementById(
        "slides"
    );


const dots =
    document.querySelectorAll(
        ".dot"
    );


function update() {

    slides.style.transform =
        `translateX(${-index * 100}%)`;


    dots.forEach(
        d =>
            d.classList.remove(
                "active"
            )
    );


    dots[index].classList.add(
        "active"
    );

}


/*
   Select slide.
*/

function go(i) {

    index = i;

    update();

}


/*
   Automatically change
   slides every 3 seconds.
*/

setInterval(
    () => {

        index =
            (index + 1) %
            dots.length;

        update();

    },
    3000
);



/* =====================================================
   SWIPE SUPPORT
===================================================== */

let startX = 0;


const carousel =
    document.getElementById(
        "carousel"
    );


carousel.addEventListener(
    "touchstart",
    e => {

        startX =
            e.touches[0].clientX;

    }
);


carousel.addEventListener(
    "touchend",
    e => {

        let endX =
            e.changedTouches[0].clientX;


        if (
            startX >
            endX + 40
        ) {

            index =
                (index + 1) %
                dots.length;

            update();

        }


        else if (
            startX <
            endX - 40
        ) {

            index =
                (index - 1 +
                    dots.length) %
                dots.length;

            update();

        }

    }
);



/* =====================================================
   FALLING FLOWERS
===================================================== */

const flowerContainer =
    document.getElementById(
        "flowers"
    );


function createFlower() {


    const flower =
        document.createElement(
            "img"
        );


    /*
       Using logo.png as the
       falling flower/petal image.
    */

    flower.src =
        "logo.png";


    flower.classList.add(
        "flower-fall"
    );


    /*
       Random horizontal position.
    */

    flower.style.left =
        Math.random() *
        window.innerWidth +
        "px";


    /*
       Random size.
    */

    let size =
        Math.random() * 30 +
        25;


    flower.style.width =
        size + "px";


    /*
       Random falling duration.
    */

    let duration =
        Math.random() * 5 +
        5;


    flower.style.animationDuration =
        duration + "s";


    /*
       Add to page.
    */

    flowerContainer.appendChild(
        flower
    );


    /*
       Remove after animation.
    */

    setTimeout(
        () => {

            flower.remove();

        },
        duration * 1000
    );

}


/*
   Start flowers.
*/

for (
    let i = 0;
    i < 12;
    i++
) {

    setTimeout(
        createFlower,
        i * 250
    );

}


/*
   Keep flowers falling.
*/

setInterval(
    createFlower,
    450
);



/* =====================================================
   SORRY CAT
===================================================== */


/*
   Clicking the floating
   cat opens sorry.html.
*/

function openSorryPage() {

    window.location.href =
        "sorry.html";

}



/* =====================================================
   OLD CAT POPUP
===================================================== */

function openCatPopup() {

    document.getElementById(
        "catPopup"
    ).style.display =
        "flex";

}


function chooseYes() {

    alert(
        "Yay! 🐱 Shivutaro loves you too!"
    );


    document.getElementById(
        "catPopup"
    ).style.display =
        "none";

}


function chooseNo() {

    alert(
        "Hmm... the cat is sad 😿"
    );


    document.getElementById(
        "catPopup"
    ).style.display =
        "none";

}

</script>


</body>
</html>

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    border:
        1px solid rgba(180, 215, 230, 0.5);

    border-radius: 18px;

    padding: 10px;

    box-shadow:
        0 20px 45px
        rgba(40, 70, 90, 0.16);

    z-index: 999;

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(-12px)
        scale(0.96);

    transform-origin:
        top right;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        visibility 0.25s ease;

}

.menu.show {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0)
        scale(1);

}


/* MENU ITEMS */

.menu a {

    display: flex;

    align-items: center;

    gap: 13px;

    padding:
        13px 14px;

    margin:
        3px 0;

    border-radius: 12px;

    text-decoration: none;

    color: #354b5b;

    font-size: 15px;

    transition:
        0.2s ease;

}

.menu a:hover {

    background:
        #eef8fd;

    color:
        #1d648c;

    transform:
        translateX(3px);

}

.menu-icon {

    width: 27px;

    text-align: center;

    font-size: 19px;

}


/* =====================================================
   TITLE
===================================================== */

.title {

    position: relative;

    z-index: 2;

    margin-top: 105px;

    text-align: center;

    font-size: 22px;

    font-weight: 600;

    color: #304b5d;

}


/* =====================================================
   CAROUSEL
===================================================== */

.wrapper {

    position: relative;

    z-index: 2;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 70vh;

}

.carousel {

    width: 90%;

    max-width: 340px;

    overflow: hidden;

    border-radius: 25px;

    background: white;

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.15);

}

.slides {

    display: flex;

    transition:
        transform 0.4s ease;

}

.slide {

    min-width: 100%;

}

.slide img {

    width: 100%;

    height: 420px;

    object-fit: cover;

}


/* =====================================================
   DOTS
===================================================== */

.dots {

    text-align: center;

    padding: 10px 0;

}

.dot {

    height: 8px;

    width: 8px;

    margin: 4px;

    display: inline-block;

    border-radius: 50%;

    background: #ccc;

    transition:
        0.3s;

    cursor: pointer;

}

.dot.active {

    background: #333;

    transform:
        scale(1.3);

}


/* =====================================================
   FLOATING SORRY CAT
===================================================== */

.sorry-cat {

    position: fixed;

    right: 22px;

    bottom: 25px;

    width: 105px;

    height: 105px;

    z-index: 800;

    cursor: pointer;

    animation:
        sorryFloat 3.5s
        ease-in-out infinite;

}


/* CAT IMAGE */

.sorry-cat img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0, 0, 0, 0.18)
        );

    transition:
        transform 0.25s ease;

}

.sorry-cat:hover img {

    transform:
        scale(1.1)
        rotate(-4deg);

}


/* =====================================================
   SORRY SPEECH BUBBLE
===================================================== */

.sorry-bubble {

    position: absolute;

    right: 82px;

    bottom: 72px;

    width: 125px;

    padding:
        9px 12px;

    background: white;

    border-radius: 14px;

    color: #714957;

    font-size: 13px;

    font-weight: 600;

    text-align: center;

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.13);

    opacity: 0;

    transform:
        translateY(8px)
        scale(0.9);

    pointer-events: none;

    transition:
        0.3s ease;

}


/* Little bubble tail */

.sorry-bubble::after {

    content: "";

    position: absolute;

    right: -8px;

    bottom: 13px;

    width: 16px;

    height: 16px;

    background: white;

    transform:
        rotate(45deg);

}


/* Show bubble on hover */

.sorry-cat:hover .sorry-bubble {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

}


@keyframes sorryFloat {

    0% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-12px);
    }

    100% {
        transform:
            translateY(0);
    }

}


/* =====================================================
   CAT POPUP
===================================================== */

.cat-popup {

    position: fixed;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.35);

    display: none;

    justify-content: center;

    align-items: center;

    z-index: 2000;

}

.popup-box {

    background: white;

    padding: 25px;

    border-radius: 18px;

    text-align: center;

    width: 280px;

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.2);

    animation:
        pop 0.3s ease;

}

@keyframes pop {

    from {

        transform:
            scale(0.8);

        opacity: 0;

    }

    to {

        transform:
            scale(1);

        opacity: 1;

    }

}

.btn-row {

    margin-top: 15px;

    display: flex;

    justify-content: space-around;

}

.yes-btn,
.no-btn {

    padding:
        8px 18px;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

}

.yes-btn {

    background:
        #bfe6ff;

    color:
        #12324a;

}

.no-btn {

    background:
        #ffd6d6;

    color:
        #a30000;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .topbar {

        height: 65px;

        padding:
            0 14px;

    }

    .logo-img {

        width: 40px;
        height: 40px;

    }

    .logo {

        font-size: 18px;

    }

    .menu {

        top: 75px;

        right: 12px;

        width:
            calc(100% - 24px);

    }

    .title {

        margin-top: 92px;

        font-size: 19px;

    }

    .wrapper {

        min-height:
            72vh;

    }

    .carousel {

        max-width:
            330px;

    }

    .slide img {

        height:
            400px;

    }

    .sorry-cat {

        width: 82px;

        height: 82px;

        right: 13px;

        bottom: 18px;

    }

    .sorry-bubble {

        right: 65px;

        bottom: 60px;

        width: 105px;

        font-size: 11px;

    }

}

</style>
</head>


<body>

<div

    <!-- HAMBURGER -->

        <span></span>

    </button>

<!-- =====================================================

===================================================== -->

<nav
    class="menu"
    id="menu">

<!-- =====================================================
     TITLE
===================================================== -->

<div class="title">

    Welcome My Madamji 🤍🐱

</div>



<!-- =====================================================
     CAROUSEL
===================================================== -->

<div class="wrapper">


    <div
        class="carousel"
        id="carousel">


        <div
            class="slides"
            id="slides">


            <div class="slide">

                <img
                    src="4.jpeg"
                    alt="Memory">

            </div>


            <div class="slide">

                    alt="Memory">

            </div>

                    src="3.jpeg"
                    alt="Memory">

            </div>


        </div>



        <!-- DOTS -->

        <div class="dots">


            <span
                class="dot active"
                onclick="go(0)">
            </span>


            <span
                class="dot"
                onclick="go(1)">
            </span>

                class="dot"
                onclick="go(2)">
            </span>

    onclick="openSorryPage()">

        src="cat10.jpg"

     EXISTING CAT
===================================================== -->

<div
    class="cat-popup"
    id="catPopup">


    <div class="popup-box">


        <h2>
            Is it a yes Shivi? 🐱
        </h2>


        <div class="btn-row">


            <button
                class="yes-btn"
                onclick="chooseYes()">

                Yes

            </button>


            <button
                class="no-btn"
                onclick="chooseNo()">

                No

            </button>


        </div>


    </div>

</div>



<script>


/* =====================================================
   HAMBURGER MENU
===================================================== */

const menuButton =
    document.getElementById(
        "menuButton"
    );

const menu =
    document.getElementById(
        "menu"
    );


/*
   Open / close menu.
*/

menuButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        menu.classList.toggle(
            "show"
        );

        menuButton.classList.toggle(
            "active"
        );

    }
);


/*
   Close menu when clicking
   somewhere else.
*/

document.addEventListener(
    "click",
    function(event) {

        if (
            !menu.contains(event.target) &&
            !menuButton.contains(event.target)
        ) {

            menu.classList.remove(
                "show"
            );

            menuButton.classList.remove(
                "active"
            );

        }

    }
);



/* =====================================================
   CAROUSEL
===================================================== */

let index = 0;


const slides =
    document.getElementById(
        "slides"
    );


const dots =
    document.querySelectorAll(
        ".dot"
    );


function update() {

    slides.style.transform =
        `translateX(${-index * 100}%)`;


    dots.forEach(
        d =>
            d.classList.remove(
                "active"
            )
    );


    dots[index].classList.add(
        "active"
    );

}


/*
   Select slide.
*/

function go(i) {

    index = i;

    update();

}


/*
   Automatically change
   slides every 3 seconds.
*/

setInterval(
    () => {

        index =
            (index + 1) %
            dots.length;

        update();

    },
    3000
);



/* =====================================================
   SWIPE SUPPORT
===================================================== */

let startX = 0;


const carousel =
    document.getElementById(
        "carousel"
    );


carousel.addEventListener(
    "touchstart",
    e => {

        startX =
            e.touches[0].clientX;

    }
);


carousel.addEventListener(
    "touchend",
    e => {

        let endX =
            e.changedTouches[0].clientX;


        if (
            startX >
            endX + 40
        ) {

            index =
                (index + 1) %
                dots.length;

            update();

        }


        else if (
            startX <
            endX - 40
        ) {

            index =
                (index - 1 +
                    dots.length) %
                dots.length;

            update();

        }

    }
);



/* =====================================================
   FALLING FLOWERS
===================================================== */

const flowerContainer =
    document.getElementById(
        "flowers"
    );


function createFlower() {


    const flower =
        document.createElement(
            "img"
        );


    /*
       Using logo.png as the
       falling flower/petal image.
    */

    flower.src =
        "logo.png";


    flower.classList.add(
        "flower-fall"
    );


    /*
       Random horizontal position.
    */

    flower.style.left =
        Math.random() *
        window.innerWidth +
        "px";


    /*
       Random size.
    */

    let size =
        Math.random() * 30 +
        25;


    flower.style.width =
        size + "px";


    /*
       Random falling duration.
    */

    let duration =
        Math.random() * 5 +
        5;


    flower.style.animationDuration =
        duration + "s";


    /*
       Add to page.
    */

    flowerContainer.appendChild(
        flower
    );


    /*
       Remove after animation.
    */

    setTimeout(
        () => {

            flower.remove();

        },
        duration * 1000
    );

}


/*
   Start flowers.
*/

for (
    let i = 0;
    i < 12;
    i++
) {

    setTimeout(
        createFlower,
        i * 250
    );

}


/*
   Keep flowers falling.
*/

setInterval(
    createFlower,
    450
);



/* =====================================================
   SORRY CAT
===================================================== */


/*
   Clicking the floating
   cat opens sorry.html.
*/

function openSorryPage() {

    window.location.href =
        "sorry.html";

}



/* =====================================================
   OLD CAT POPUP
===================================================== */

function openCatPopup() {

    document.getElementById(
        "catPopup"
    ).style.display =
        "flex";

}


function chooseYes() {

    alert(
        "Yay! 🐱 Shivutaro loves you too!"
    );


    document.getElementById(
        "catPopup"
    ).style.display =
        "none";

}


function chooseNo() {

    alert(
        "Hmm... the cat is sad 😿"
    );


    document.getElementById(
        "catPopup"
    ).style.display =
        "none";

}

</script>
