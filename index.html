<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shivutaro 🐱</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(190, 230, 255, 0.45),
            transparent 25%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(255, 220, 235, 0.45),
            transparent 30%
        ),

        #f5fbff;

    overflow-x: hidden;

    color: #253746;
}


/* =====================================================
   FALLING FLOWERS
===================================================== */

.flowers {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}

.flower-fall {

    position: absolute;

    top: -60px;

    width: 35px;

    opacity: 0.65;

    animation:
        fall linear forwards,
        sway ease-in-out infinite alternate;

    filter:
        drop-shadow(
            0 0 5px rgba(0,0,0,0.12)
        );
}

@keyframes fall {

    0% {

        transform:
            translateY(0)
            translateX(0)
            rotate(0deg);

    }

    100% {

        transform:
            translateY(110vh)
            translateX(80px)
            rotate(360deg);

    }

}

@keyframes sway {

    from {
        margin-left: -30px;
    }

    to {
        margin-left: 30px;
    }

}


/* =====================================================
   NAVBAR
===================================================== */

.topbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 22px;

    background:
        rgba(255,255,255,0.88);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    border-bottom:
        1px solid rgba(170,210,230,0.35);

    box-shadow:
        0 3px 18px
        rgba(0,0,0,0.06);

    z-index: 1000;
}


/* LOGO */

.logo {

    display: flex;

    align-items: center;

    gap: 9px;

    font-weight: 700;

    font-size: 20px;

    color: #253f52;

}

.logo-img {

    width: 46px;
    height: 46px;

    object-fit: contain;

    border-radius: 10px;

    filter:
        drop-shadow(
            0 4px 7px
            rgba(0,0,0,0.10)
        );

}


/* =====================================================
   HAMBURGER
===================================================== */

.menu-button {

    width: 45px;
    height: 45px;

    border: none;

    border-radius: 12px;

    background:
        rgba(220,242,255,0.8);

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 5px;

    transition: 0.25s ease;
}

.menu-button span {

    width: 23px;

    height: 2.5px;

    border-radius: 5px;

    background: #35576d;

    transition: 0.3s ease;
}

.menu-button:hover {

    background: #c7e9fa;

    transform:
        translateY(-1px);
}


/* X */

.menu-button.active span:nth-child(1) {

    transform:
        translateY(7.5px)
        rotate(45deg);
}

.menu-button.active span:nth-child(2) {

    opacity: 0;
}

.menu-button.active span:nth-child(3) {

    transform:
        translateY(-7.5px)
        rotate(-45deg);
}


/* =====================================================
   MENU
===================================================== */

.menu {

    position: fixed;

    top: 82px;

    right: 18px;

    width: 245px;

    background:
        rgba(255,255,255,0.96);

    backdrop-filter:
        blur(16px);

    border:
        1px solid rgba(180,215,230,0.5);

    border-radius: 18px;

    padding: 10px;

    box-shadow:
        0 20px 45px
        rgba(40,70,90,0.16);

    z-index: 999;

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(-12px)
        scale(0.96);

    transform-origin:
        top right;

    transition:
        0.25s ease;
}

.menu.show {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0)
        scale(1);
}

.menu a {

    display: flex;

    align-items: center;

    gap: 13px;

    padding: 13px 14px;

    margin: 3px 0;

    border-radius: 12px;

    text-decoration: none;

    color: #354b5b;

    font-size: 15px;

    transition: 0.2s ease;
}

.menu a:hover {

    background: #eef8fd;

    color: #1d648c;

    transform:
        translateX(3px);
}

.menu-icon {

    width: 27px;

    text-align: center;

    font-size: 19px;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    position: relative;

    z-index: 2;

    margin-top: 105px;

    text-align: center;

    font-size: 22px;

    font-weight: 600;

    color: #304b5d;
}


/* =====================================================
   CAROUSEL
===================================================== */

.wrapper {

    position: relative;

    z-index: 2;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 65vh;
}

.carousel {

    width: 90%;

    max-width: 340px;

    overflow: hidden;

    border-radius: 25px;

    background: white;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.15);
}

.slides {

    display: flex;

    transition:
        transform 0.4s ease;
}

.slide {

    min-width: 100%;
}

.slide img {

    width: 100%;

    height: 420px;

    object-fit: cover;
}

.dots {

    text-align: center;

    padding: 10px 0;
}

.dot {

    height: 8px;

    width: 8px;

    margin: 4px;

    display: inline-block;

    border-radius: 50%;

    background: #ccc;

    transition: 0.3s;

    cursor: pointer;
}

.dot.active {

    background: #333;

    transform:
        scale(1.3);
}


/* =====================================================
   GAME SECTION
===================================================== */

.game-section {

    position: relative;

    z-index: 5;

    width: min(900px, 94%);

    margin: 50px auto 120px;

    text-align: center;

}


/* GAME TITLE */

.game-title {

    font-size: 30px;

    color: #304b5d;

    margin-bottom: 6px;
}

.game-subtitle {

    color: #718899;

    font-size: 14px;

    margin-bottom: 18px;
}


/* =====================================================
   GAME CARD
===================================================== */

.game-card {

    background:
        rgba(255,255,255,0.90);

    border:
        1px solid rgba(170,210,230,0.45);

    border-radius: 28px;

    padding: 18px;

    box-shadow:
        0 20px 60px
        rgba(50,90,110,0.13);

    backdrop-filter:
        blur(10px);
}


/* =====================================================
   GAME SCORE BAR
===================================================== */

.game-stats {

    display: flex;

    justify-content: space-around;

    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}

.stat {

    flex: 1;

    background:
        #f2f9fd;

    border-radius: 15px;

    padding: 9px 5px;

    border:
        1px solid #e0f0f7;
}

.stat-label {

    display: block;

    font-size: 11px;

    color: #7890a0;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.stat-value {

    display: block;

    font-size: 21px;

    font-weight: 700;

    color: #35576d;

    margin-top: 2px;
}


/* =====================================================
   GAME BOARD
===================================================== */

.game-board {

    position: relative;

    width: 100%;

    height: 420px;

    overflow: hidden;

    border-radius: 22px;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,0.9),
            transparent 20%
        ),

        linear-gradient(
            135deg,
            #eaf8ff,
            #fff4f8
        );

    border:
        2px solid rgba(180,215,230,0.45);

    touch-action: none;

    user-select: none;
}


/* little grass */

.game-board::before {

    content: "🌿  🌱  🌿  🌱  🌿  🌱  🌿";

    position: absolute;

    bottom: 5px;

    left: 0;

    width: 100%;

    font-size: 19px;

    opacity: 0.5;

    letter-spacing: 12px;

    pointer-events: none;
}


/* =====================================================
   PLAYER CAT
===================================================== */

.player {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 54px;

    height: 54px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 43px;

    transform:
        translate(-50%,-50%);

    transition:
        left 0.04s linear,
        top 0.04s linear;

    z-index: 10;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(0,0,0,0.15)
        );

    pointer-events: none;
}


/* =====================================================
   MOUSE
===================================================== */

.prey {

    position: absolute;

    width: 50px;

    height: 50px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 38px;

    z-index: 8;

    transition:
        left 0.15s ease,
        top 0.15s ease;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,0.12)
        );
}


/* =====================================================
   CATCH EFFECT
===================================================== */

.catch-effect {

    position: absolute;

    pointer-events: none;

    font-size: 28px;

    animation:
        catchPop 0.6s ease forwards;

    z-index: 30;
}

@keyframes catchPop {

    0% {

        transform:
            scale(0.5);

        opacity: 1;
    }

    100% {

        transform:
            scale(2)
            translateY(-25px);

        opacity: 0;
    }
}


/* =====================================================
   START BUTTON
===================================================== */

.start-button {

    margin-top: 17px;

    border: none;

    padding:
        13px 30px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #8fd3ff,
            #c8a7ff
        );

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 8px 22px
        rgba(100,150,200,0.25);

    transition:
        0.25s ease;
}

.start-button:hover {

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 12px 30px
        rgba(100,150,200,0.35);
}


/* =====================================================
   MOBILE CONTROLS
===================================================== */

.controls {

    display: none;

    width: 180px;

    margin:
        18px auto 3px;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;
}

.control {

    width: 55px;

    height: 48px;

    border: none;

    border-radius: 14px;

    background:
        #e7f5fc;

    color: #35576d;

    font-size: 22px;

    font-weight: bold;

    box-shadow:
        0 4px 10px
        rgba(50,90,110,0.10);

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color:
        transparent;
}

.control:active {

    transform:
        scale(0.92);

    background:
        #ccecf9;
}

.up {

    grid-column: 2;
}

.left {

    grid-column: 1;
    grid-row: 2;
}

.down {

    grid-column: 2;
    grid-row: 2;
}

.right {

    grid-column: 3;
    grid-row: 2;
}


/* =====================================================
   GAME MESSAGE
===================================================== */

.game-message {

    min-height: 22px;

    margin-top: 10px;

    color: #718899;

    font-size: 14px;
}


/* =====================================================
   GAME OVER
===================================================== */

.game-over {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background:
        rgba(255,255,255,0.88);

    backdrop-filter:
        blur(8px);

    z-index: 100;

    opacity: 0;

    visibility: hidden;

    transition: 0.3s ease;
}

.game-over.show {

    opacity: 1;

    visibility: visible;
}

.game-over h2 {

    font-size: 30px;

    margin: 0 0 8px;

    color: #704957;
}

.game-over p {

    color: #718899;

    margin: 4px;
}


/* =====================================================
   HIGH SCORE
===================================================== */

.high-score {

    margin-top: 12px;

    color: #8d6574;

    font-size: 13px;
}


/* =====================================================
   SORRY CAT
===================================================== */

.sorry-cat {

    position: fixed;

    right: 22px;

    bottom: 25px;

    width: 105px;

    height: 105px;

    z-index: 800;

    cursor: pointer;

    animation:
        sorryFloat 3.5s
        ease-in-out infinite;
}

.sorry-cat img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0,0,0,0.18)
        );

    transition:
        transform 0.25s ease;
}

.sorry-cat:hover img {

    transform:
        scale(1.1)
        rotate(-4deg);
}

.sorry-bubble {

    position: absolute;

    right: 82px;

    bottom: 72px;

    width: 125px;

    padding: 9px 12px;

    background: white;

    border-radius: 14px;

    color: #714957;

    font-size: 13px;

    font-weight: 600;

    text-align: center;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.13);

    opacity: 0;

    transform:
        translateY(8px)
        scale(0.9);

    pointer-events: none;

    transition:
        0.3s ease;
}

.sorry-bubble::after {

    content: "";

    position: absolute;

    right: -8px;

    bottom: 13px;

    width: 16px;

    height: 16px;

    background: white;

    transform:
        rotate(45deg);
}

.sorry-cat:hover .sorry-bubble {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

@keyframes sorryFloat {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

    100% {
        transform: translateY(0);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .topbar {

        height: 65px;

        padding: 0 14px;
    }

    .logo-img {

        width: 40px;
        height: 40px;
    }

    .logo {

        font-size: 18px;
    }

    .menu {

        top: 75px;

        right: 12px;

        width:
            calc(100% - 24px);
    }

    .title {

        margin-top: 92px;

        font-size: 19px;
    }

    .wrapper {

        min-height:
            68vh;
    }

    .carousel {

        max-width:
            330px;
    }

    .slide img {

        height:
            400px;
    }

    .game-section {

        margin-top: 30px;
    }

    .game-title {

        font-size: 25px;
    }

    .game-board {

        height: 360px;
    }

    .player {

        font-size: 38px;

        width: 48px;

        height: 48px;
    }

    .prey {

        font-size: 32px;
    }

    .controls {

        display: grid;
    }

    .sorry-cat {

        width: 82px;

        height: 82px;

        right: 13px;

        bottom: 18px;
    }

    .sorry-bubble {

        right: 65px;

        bottom: 60px;

        width: 105px;

        font-size: 11px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     FALLING FLOWERS
===================================================== -->

<div
    class="flowers"
    id="flowers">
</div>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="topbar">

    <div class="logo">

        <img
            src="logo.png"
            class="logo-img"
            alt="Shivutaro">

        <span>
            Shivutaro
        </span>

    </div>


    <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu">

        <span></span>
        <span></span>
        <span></span>

    </button>

</header>


<!-- =====================================================
     MENU
===================================================== -->

<nav
    class="menu"
    id="menu">

    <a href="index.html">

        <span class="menu-icon">🏠</span>

        <span>Home</span>

    </a>

    <a href="gallery.html">

        <span class="menu-icon">🖼️</span>

        <span>Gallery</span>

    </a>

    <a href="index2.html">

        <span class="menu-icon">💌</span>

        <span>Message</span>

    </a>

    <a href="sorry.html">

        <span class="menu-icon">🥺</span>

        <span>I'm Sorry</span>

    </a>

    <a href="imp.html">

        <span class="menu-icon">🔔</span>

        <span>Alerts</span>

    </a>

    <a href="billimart.html">

        <span class="menu-icon">🧠</span>

        <span>Billi Mart</span>

    </a>

</nav>


<!-- =====================================================
     TITLE
===================================================== -->

<div class="title">

    Welcome My Madamji 🤍🐱

</div>


<!-- =====================================================
     CAROUSEL
===================================================== -->

<div class="wrapper">

    <div
        class="carousel"
        id="carousel">

        <div
            class="slides"
            id="slides">

            <div class="slide">

                <img
                    src="4.jpeg"
                    alt="Memory">

            </div>

            <div class="slide">

                <img
                    src="5.jpeg"
                    alt="Memory">

            </div>

            <div class="slide">

                <img
                    src="3.jpeg"
                    alt="Memory">

            </div>

        </div>


        <div class="dots">

            <span
                class="dot active"
                onclick="go(0)">
            </span>

            <span
                class="dot"
                onclick="go(1)">
            </span>

            <span
                class="dot"

            </span>

        </div>

    </div>

</div>


<!-- =====================================================
     CAT CHASE GAME
===================================================== -->

<section class="game-section">

    <h1 class="game-title">
        🐱 Cat Chase 🐭
    </h1>

    <p class="game-subtitle">
        Catch the mouse before time runs out!
    </p>


    <div class="game-card">


        <!-- STATS -->

        <div class="game-stats">

            <div class="stat">

                <span class="stat-label">
                    Score
                </span>

                <span
                    class="stat-value"
                    id="score">
                    0
                </span>

            </div>


            <div class="stat">

                <span class="stat-label">
                    Time
                </span>

                <span
                    class="stat-value"
                    id="time">
                    30
                </span>

            </div>


            <div class="stat">

                <span class="stat-label">
                    Combo
                </span>

                <span
                    class="stat-value"
                    id="combo">
                    x0
                </span>

            </div>

        </div>


        <!-- GAME BOARD -->

        <div
            class="game-board"
            id="gameBoard">


            <!-- PLAYER -->

            <div
                class="player"
                id="player">

                🐱

            </div>


            <!-- PREY -->

            <div
                class="prey"
                id="prey">

                🐭

            </div>


            <!-- GAME OVER -->

            <div
                class="game-over"
                id="gameOver">

                <h2>
                    Time's Up! 🐾
                </h2>

                <p>
                    Your score:
                    <strong id="finalScore">
                        0
                    </strong>
                </p>

                <p>
                    Best score:
                    <strong id="bestScore">
                        0
                    </strong>
                </p>

                <button
                    class="start-button"
                    onclick="startGame()">

                    Play Again 🐱

                </button>

            </div>

        </div>


        <!-- MESSAGE -->

        <div
            class="game-message"
            id="gameMessage">

            Press Start and catch the mouse! 🐭

        </div>

        <button
            class="start-button"
            id="startButton"
            onclick="startGame()">

            Start Cat Chase 🐱

        </button>

        <div class="controls">

            <button
                class="control up"
                data-direction="up">

                ↑

            </button>

            <button
                class="control left"
                data-direction="left">

                ←

            </button>

            <button
                class="control down"
                data-direction="down">

                ↓

            </button>

            <button
                class="control right"
                data-direction="right">

                →

            </button>

        </div>


        <div class="high-score">

            🏆 High Score:
            <span id="highScore">
                0
            </span>

        </div>

    </div>

</section>


<!-- =====================================================
     SORRY CAT
===================================================== -->

<div
    class="sorry-cat"
    onclick="openSorryPage()">

    <div class="sorry-bubble">

        I'm sorry, Madamji 🥺🤍

    </div>

    <img
        src="cat7.jpg"
        alt="Sorry cat">

</div>


<script>


/* =====================================================
   HAMBURGER MENU
===================================================== */

const menuButton =
    document.getElementById(
        "menuButton"
    );

const menu =
    document.getElementById(
        "menu"
    );


menuButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        menu.classList.toggle("show");

        menuButton.classList.toggle("active");

    }
);


document.addEventListener(
    "click",
    function(event) {

        if (
            !menu.contains(event.target) &&
            !menuButton.contains(event.target)
        ) {

            menu.classList.remove("show");

            menuButton.classList.remove("active");

        }

    }
);


/* =====================================================
   CAROUSEL
===================================================== */

let index = 0;

const slides =
    document.getElementById("slides");

const dots =
    document.querySelectorAll(".dot");


function update() {

    slides.style.transform =
        `translateX(${-index * 100}%)`;

    dots.forEach(
        d =>
            d.classList.remove("active")
    );

    dots[index].classList.add("active");

}


function go(i) {

    index = i;

    update();

}


setInterval(
    () => {

        index =
            (index + 1) %
            dots.length;

        update();

    },
    3000
);


/* =====================================================
   SWIPE
===================================================== */

let startX = 0;

const carousel =
    document.getElementById(
        "carousel"
    );


carousel.addEventListener(
    "touchstart",
    e => {

        startX =
            e.touches[0].clientX;

    }
);


carousel.addEventListener(
    "touchend",
    e => {

        const endX =
            e.changedTouches[0].clientX;


        if (
            startX >
            endX + 40
        ) {

            index =
                (index + 1) %
                dots.length;

            update();

        }

        else if (
            startX <
            endX - 40
        ) {

            index =
                (index - 1 +
                    dots.length) %
                dots.length;

            update();

        }

    }
);


/* =====================================================
   FALLING FLOWERS
===================================================== */

const flowerContainer =
    document.getElementById(
        "flowers"
    );


function createFlower() {

    const flower =
        document.createElement("img");

    flower.src =
        "logo.png";

    flower.classList.add(
        "flower-fall"
    );

    flower.style.left =
        Math.random() *
        window.innerWidth +
        "px";


    const size =
        Math.random() * 30 + 25;

    flower.style.width =
        size + "px";


    const duration =
        Math.random() * 5 + 5;

    flower.style.animationDuration =
        duration + "s";


    flowerContainer.appendChild(
        flower
    );


    setTimeout(
        () => {

            flower.remove();

        },
        duration * 1000
    );

}


for (
    let i = 0;
    i < 12;
    i++
) {

    setTimeout(
        createFlower,
        i * 250
    );

}


setInterval(
    createFlower,
    450
);


/* =====================================================
   SORRY CAT
===================================================== */

function openSorryPage() {

    window.location.href =
        "sorry.html";

}


/* =====================================================
   CAT CHASE GAME
===================================================== */

const gameBoard =
    document.getElementById(
        "gameBoard"
    );

const player =
    document.getElementById(
        "player"
    );

const prey =
    document.getElementById(
        "prey"
    );

const scoreElement =
    document.getElementById(
        "score"
    );

const timeElement =
    document.getElementById(
        "time"
    );

const comboElement =
    document.getElementById(
        "combo"
    );

const gameMessage =
    document.getElementById(
        "gameMessage"
    );

const gameOver =
    document.getElementById(
        "gameOver"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const bestScoreElement =
    document.getElementById(
        "bestScore"
    );

const highScoreElement =
    document.getElementById(
        "highScore"
    );

const startButton =
    document.getElementById(
        "startButton"
    );


/* PLAYER POSITION */

let playerX = 50;

let playerY = 50;


/* GAME DATA */

let score = 0;

let combo = 0;

let timeLeft = 30;

let gameRunning = false;

let gameTimer;

let movementTimer;


/* HIGH SCORE */

let highScore =
    Number(
        localStorage.getItem(
            "shivutaroCatHighScore"
        )
    ) || 0;

highScoreElement.textContent =
    highScore;


/* =====================================================
   UPDATE PLAYER
===================================================== */

function updatePlayer() {

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}


/* =====================================================
   MOVE CAT
===================================================== */

function moveCat(direction) {

    if (!gameRunning) {
        return;
    }


    const speed = 4;


    if (direction === "up") {

        playerY -= speed;

    }

    if (direction === "down") {

        playerY += speed;

    }

    if (direction === "left") {

        playerX -= speed;

    }

    if (direction === "right") {

        playerX += speed;

    }


    /* Keep inside board */

    playerX =
        Math.max(
            5,
            Math.min(
                95,
                playerX
            )
        );


    playerY =
        Math.max(
            8,
            Math.min(
                90,
                playerY
            )
        );


    updatePlayer();


    checkCatch();

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (!gameRunning) {
            return;
        }


        const key =
            event.key.toLowerCase();


        if (
            key === "arrowup" ||
            key === "w"
        ) {

            event.preventDefault();

            moveCat("up");

        }


        if (
            key === "arrowdown" ||
            key === "s"
        ) {

            event.preventDefault();

            moveCat("down");

        }


        if (
            key === "arrowleft" ||
            key === "a"
        ) {

            event.preventDefault();

            moveCat("left");

        }


        if (
            key === "arrowright" ||
            key === "d"
        ) {

            event.preventDefault();

            moveCat("right");

        }

    }
);


/* =====================================================
   MOBILE BUTTONS
===================================================== */

document
    .querySelectorAll(".control")
    .forEach(button => {

        button.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                moveCat(
                    this.dataset.direction
                );

            }
        );

    });


/* =====================================================
   MOVE MOUSE
===================================================== */

function movePrey() {

    const x =
        8 + Math.random() * 84;

    const y =
        10 + Math.random() * 78;


    prey.style.left =
        x + "%";

    prey.style.top =
        y + "%";

}


/* =====================================================
   CHECK CATCH
===================================================== */

function checkCatch() {

    const dx =
        playerX -
        parseFloat(
            prey.style.left || 50
        );

    const dy =
        playerY -
        parseFloat(
            prey.style.top || 50
        );


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance < 8) {

        catchMouse();

    }

}


/* =====================================================
   CATCH MOUSE
===================================================== */

function catchMouse() {

    combo++;

    score +=
        10 +
        (combo - 1) * 2;


    scoreElement.textContent =
        score;

    comboElement.textContent =
        "x" + combo;


    gameMessage.textContent =
        combo >= 3
            ? "WOW! 🐱🔥 Keep chasing!"
            : "Gotcha! 🐭💥";


    createCatchEffect();


    movePrey();

}


/* =====================================================
   CATCH EFFECT
===================================================== */

function createCatchEffect() {

    const effect =
        document.createElement("div");

    effect.className =
        "catch-effect";

    effect.textContent =
        "💥 +10";


    effect.style.left =
        playerX + "%";

    effect.style.top =
        playerY + "%";


    gameBoard.appendChild(
        effect
    );


    setTimeout(
        () => {

            effect.remove();

        },
        600
    );

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    clearInterval(gameTimer);


    score = 0;

    combo = 0;

    timeLeft = 30;

    gameRunning = true;


    scoreElement.textContent =
        "0";

    comboElement.textContent =
        "x0";

    timeElement.textContent =
        "30";


    playerX = 50;

    playerY = 50;

    updatePlayer();

    movePrey();


    gameOver.classList.remove(
        "show"
    );


    startButton.textContent =
        "Restart Game 🔄";


    gameMessage.textContent =
        "Catch that mouse! 🐭";


    gameTimer =
        setInterval(
            gameTick,
            1000
        );

}


/* =====================================================
   GAME TIMER
===================================================== */

function gameTick() {

    timeLeft--;


    timeElement.textContent =
        timeLeft;


    if (timeLeft <= 0) {

        endGame();

    }

}


/* =====================================================
   END GAME
===================================================== */

function endGame() {

    gameRunning = false;


    clearInterval(gameTimer);


    finalScore.textContent =
        score;


    if (score > highScore) {

        highScore = score;


        localStorage.setItem(
            "shivutaroCatHighScore",
            highScore
        );

    }


    highScoreElement.textContent =
        highScore;

    bestScoreElement.textContent =
        highScore;


    gameMessage.textContent =
        "Great chase! 🐱❤️";


    gameOver.classList.add(
        "show"
    );

}


</script>
