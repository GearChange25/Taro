<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shivutaro</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(190, 230, 255, 0.45),
            transparent 25%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(255, 220, 235, 0.45),
            transparent 30%
        ),
        #f5fbff;

    overflow-x: hidden;

    color: #253746;
}


/* =====================================================
   FALLING FLOWERS
===================================================== */

.flowers {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}

.flower-fall {
    position: absolute;

    top: -60px;

    width: 35px;

    opacity: 0.65;

    animation:
        fall linear forwards,
        sway ease-in-out infinite alternate;

    filter:
        drop-shadow(
            0 0 5px rgba(0, 0, 0, 0.12)
        );
}

@keyframes fall {

    0% {
        transform:
            translateY(0)
            translateX(0)
            rotate(0deg);
    }

    100% {
        transform:
            translateY(110vh)
            translateX(80px)
            rotate(360deg);
    }

}

@keyframes sway {

    from {
        margin-left: -30px;
    }

    to {
        margin-left: 30px;
    }

}


/* =====================================================
   NAVBAR
===================================================== */

.topbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 22px;

    background:
        rgba(255, 255, 255, 0.88);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    border-bottom:
        1px solid rgba(170, 210, 230, 0.35);

    box-shadow:
        0 3px 18px rgba(0, 0, 0, 0.06);

    z-index: 1000;
}


/* =====================================================
   LOGO
===================================================== */

.logo {

    display: flex;

    align-items: center;

    gap: 9px;

    font-weight: 700;

    font-size: 20px;

    color: #253f52;

}

.logo-img {

    width: 46px;
    height: 46px;

    object-fit: contain;

    border-radius: 10px;

    filter:
        drop-shadow(
            0 4px 7px
            rgba(0, 0, 0, 0.10)
        );

}


/* =====================================================
   HAMBURGER BUTTON
===================================================== */

.menu-button {

    width: 45px;
    height: 45px;

    border: none;

    border-radius: 12px;

    background:
        rgba(220, 242, 255, 0.8);

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 5px;

    transition:
        0.25s ease;

}

.menu-button span {

    width: 23px;

    height: 2.5px;

    border-radius: 5px;

    background: #35576d;

    transition:
        0.3s ease;

}

.menu-button:hover {

    background: #c7e9fa;

    transform:
        translateY(-1px);

}


/* Hamburger → X */

.menu-button.active span:nth-child(1) {

    transform:
        translateY(7.5px)
        rotate(45deg);

}

.menu-button.active span:nth-child(2) {

    opacity: 0;

}

.menu-button.active span:nth-child(3) {

    transform:
        translateY(-7.5px)
        rotate(-45deg);

}


/* =====================================================
   DROPDOWN MENU
===================================================== */

.menu {

    position: fixed;

    top: 82px;

    right: 18px;

    width: 245px;

    background:
        rgba(255, 255, 255, 0.96);

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    border:
        1px solid rgba(180, 215, 230, 0.5);

    border-radius: 18px;

    padding: 10px;

    box-shadow:
        0 20px 45px
        rgba(40, 70, 90, 0.16);

    z-index: 999;

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(-12px)
        scale(0.96);

    transform-origin:
        top right;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        visibility 0.25s ease;
}

.menu.show {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0)
        scale(1);

}


/* MENU LINKS */

.menu a {

    display: flex;

    align-items: center;

    gap: 13px;

    padding: 13px 14px;

    margin: 3px 0;

    border-radius: 12px;

    text-decoration: none;

    color: #354b5b;

    font-size: 15px;

    transition:
        0.2s ease;

}

.menu a:hover {

    background: #eef8fd;

    color: #1d648c;

    transform:
        translateX(3px);

}

.menu-icon {

    width: 27px;

    text-align: center;

    font-size: 19px;

}


/* =====================================================
   TITLE
===================================================== */

.title {

    position: relative;

    z-index: 2;

    margin-top: 105px;

    padding: 0 15px;

    text-align: center;

    font-size: 22px;

    font-weight: 600;

    color: #304b5d;

}


/* =====================================================
   CAROUSEL AREA
===================================================== */

.wrapper {

    position: relative;

    z-index: 2;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: calc(100vh - 150px);

    padding:
        30px 0 70px;
}


/* =====================================================
   CAROUSEL
===================================================== */

.carousel {

    width: 90%;

    max-width: 340px;

    overflow: hidden;

    border-radius: 25px;

    background: white;

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.15);

}

.slides {

    display: flex;

    transition:
        transform 0.4s ease;

}

.slide {

    min-width: 100%;

}

.slide img {

    display: block;

    width: 100%;

    height: 420px;

    object-fit: cover;

}


/* =====================================================
   DOTS
===================================================== */

.dots {

    text-align: center;

    padding: 10px 0;

}

.dot {

    height: 8px;

    width: 8px;

    margin: 4px;

    display: inline-block;

    border-radius: 50%;

    background: #ccc;

    transition:
        0.3s;

    cursor: pointer;

}

.dot.active {

    background: #333;

    transform:
        scale(1.3);

}


/* =====================================================
   FLOATING SORRY CAT
===================================================== */

.sorry-cat {

    position: fixed;

    right: 22px;

    bottom: 25px;

    width: 105px;

    height: 105px;

    z-index: 800;

    cursor: pointer;

    animation:
        sorryFloat 3.5s
        ease-in-out infinite;

}


/* CAT IMAGE */

.sorry-cat img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0, 0, 0, 0.18)
        );

    transition:
        transform 0.25s ease;

}

.sorry-cat:hover img {

    transform:
        scale(1.1)
        rotate(-4deg);

}


/* =====================================================
   SORRY SPEECH BUBBLE
===================================================== */

.sorry-bubble {

    position: absolute;

    right: 82px;

    bottom: 72px;

    width: 135px;

    padding: 9px 12px;

    background: white;

    border-radius: 14px;

    color: #714957;

    font-size: 13px;

    font-weight: 600;

    text-align: center;

    box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.13);

    opacity: 0;

    transform:
        translateY(8px)
        scale(0.9);

    pointer-events: none;

    transition:
        0.3s ease;

}


/* Bubble tail */

.sorry-bubble::after {

    content: "";

    position: absolute;

    right: -8px;

    bottom: 13px;

    width: 16px;

    height: 16px;

    background: white;

    transform:
        rotate(45deg);

}


/* Show bubble */

.sorry-cat:hover .sorry-bubble {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

}


/* =====================================================
   SORRY CAT FLOATING ANIMATION
===================================================== */

@keyframes sorryFloat {

    0% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-12px);
    }

    100% {
        transform:
            translateY(0);
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .topbar {

        height: 65px;

        padding:
            0 14px;

    }


    .logo-img {

        width: 40px;

        height: 40px;

    }


    .logo {

        font-size: 18px;

    }


    .menu {

        top: 75px;

        right: 12px;

        width:
            calc(100% - 24px);

    }


    .title {

        margin-top: 92px;

        font-size: 19px;

        line-height: 1.5;

    }


    .wrapper {

        min-height:
            calc(100vh - 140px);

        padding:
            25px 0 100px;

    }


    .carousel {

        width:
            calc(100% - 30px);

        max-width:
            330px;

    }


    .slide img {

        height:
            400px;

    }


    .sorry-cat {

        width: 82px;

        height: 82px;

        right: 13px;

        bottom: 18px;

    }


    .sorry-bubble {

        right: 65px;

        bottom: 60px;

        width: 110px;

        font-size: 11px;

    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    .title {

        font-size: 18px;

    }

    .carousel {

        max-width:
            310px;

    }

    .slide img {

        height:
            370px;

    }

    .sorry-cat {

        width: 72px;

        height: 72px;

        right: 10px;

        bottom: 15px;

    }

}

</style>
</head>


<body>


<!-- =====================================================
     FALLING FLOWERS
===================================================== -->

<div
    class="flowers"
    id="flowers">
</div>



<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="topbar">


    <!-- LOGO -->

    <div class="logo">

        <img
            src="logo.png"
            class="logo-img"
            alt="Shivutaro">

        <span>
            Shivutaro
        </span>

    </div>


    <!-- HAMBURGER -->

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu"
        aria-expanded="false">

        <span></span>
        <span></span>
        <span></span>

    </button>

</header>



<!-- =====================================================
     DROPDOWN MENU
===================================================== -->

<nav
    class="menu"
    id="menu">

    <a href="index.html">

        <span class="menu-icon">
            🏠
        </span>

        <span>
            Home
        </span>

    </a>


    <a href="gallery.html">

        <span class="menu-icon">
            🖼️
        </span>

        <span>
            Gallery
        </span>

    </a>


    <a href="index2.html">

        <span class="menu-icon">
            💌
        </span>

        <span>
            Message
        </span>

    </a>


    <a href="sorry.html">

        <span class="menu-icon">
            🥺
        </span>

        <span>
            I'm Sorry
        </span>

    </a>


    <a href="imp.html">

        <span class="menu-icon">
            🔔
        </span>

        <span>
            Alerts
        </span>

    </a>


    <a href="billimart.html">

        <span class="menu-icon">
            🧠
        </span>

        <span>
            Billi Mart
        </span>

    </a>

</nav>



<!-- =====================================================
     TITLE
===================================================== -->

<div class="title">

    Welcome My Madamji 🤍🐱

</div>



<!-- =====================================================
     CAROUSEL
===================================================== -->

<div class="wrapper">

    <div
        class="carousel"
        id="carousel">


        <div
            class="slides"
            id="slides">


            <div class="slide">

                <img
                    src="4.jpeg"
                    alt="Memory 1">

            </div>


            <div class="slide">

                <img
                    src="5.jpeg"
                    alt="Memory 2">

            </div>


            <div class="slide">

                <img
                    src="3.jpeg"
                    alt="Memory 3">

            </div>


        </div>


        <!-- DOTS -->

        <div class="dots">

            <span
                class="dot active"
                onclick="go(0)">
            </span>

            <span
                class="dot"
                onclick="go(1)">
            </span>

            <span
                class="dot"
                onclick="go(2)">
            </span>

        </div>

    </div>

</div>



<!-- =====================================================
     FLOATING SORRY CAT
===================================================== -->

<div
    class="sorry-cat"
    onclick="openSorryPage()">

    <div class="sorry-bubble">

        I'm sorry, Madamji 🥺🤍

    </div>

    <img
        src="cat10.jpg"
        alt="Sorry cat">

</div>



<script>

/* =====================================================
   HAMBURGER MENU
===================================================== */

const menuButton =
    document.getElementById("menuButton");

const menu =
    document.getElementById("menu");


menuButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        const isOpen =
            menu.classList.toggle("show");

        menuButton.classList.toggle(
            "active"
        );

        menuButton.setAttribute(
            "aria-expanded",
            isOpen
        );

    }
);


/* =====================================================
   CLOSE MENU WHEN CLICKING OUTSIDE
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            !menu.contains(event.target) &&
            !menuButton.contains(event.target)
        ) {

            menu.classList.remove("show");

            menuButton.classList.remove(
                "active"
            );

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);


/* =====================================================
   CLOSE MENU AFTER CLICKING A LINK
===================================================== */

const menuLinks =
    document.querySelectorAll(".menu a");

menuLinks.forEach(
    link => {

        link.addEventListener(
            "click",
            function() {

                menu.classList.remove(
                    "show"
                );

                menuButton.classList.remove(
                    "active"
                );

            }
        );

    }
);


/* =====================================================
   CAROUSEL
===================================================== */

let index = 0;

const slides =
    document.getElementById("slides");

const dots =
    document.querySelectorAll(".dot");


function update() {

    slides.style.transform =
        `translateX(${-index * 100}%)`;

    dots.forEach(
        dot => {

            dot.classList.remove(
                "active"
            );

        }
    );

    dots[index].classList.add(
        "active"
    );

}


/* =====================================================
   SELECT SLIDE
===================================================== */

function go(i) {

    index = i;

    update();

}


/* =====================================================
   AUTO SLIDES
===================================================== */

setInterval(
    function() {

        index =
            (index + 1) %
            dots.length;

        update();

    },
    3000
);


/* =====================================================
   SWIPE SUPPORT
===================================================== */

let startX = 0;

const carousel =
    document.getElementById("carousel");


carousel.addEventListener(
    "touchstart",
    function(event) {

        startX =
            event.touches[0].clientX;

    },
    {
        passive: true
    }
);


carousel.addEventListener(
    "touchend",
    function(event) {

        const endX =
            event.changedTouches[0].clientX;

        if (
            startX >
            endX + 40
        ) {

            index =
                (index + 1) %
                dots.length;

            update();

        }

        else if (
            startX <
            endX - 40
        ) {

            index =
                (index - 1 + dots.length) %
                dots.length;

            update();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   FALLING FLOWERS
===================================================== */

const flowerContainer =
    document.getElementById("flowers");


function createFlower() {

    const flower =
        document.createElement("img");


    flower.src =
        "logo.png";


    flower.classList.add(
        "flower-fall"
    );


    /* Random position */

    flower.style.left =
        Math.random() *
        window.innerWidth +
        "px";


    /* Random size */

    const size =
        Math.random() * 30 + 25;

    flower.style.width =
        size + "px";


    /* Random speed */

    const duration =
        Math.random() * 5 + 5;

    flower.style.animationDuration =
        duration + "s";


    flowerContainer.appendChild(
        flower
    );


    /* Remove after animation */

    setTimeout(
        function() {

            flower.remove();

        },
        duration * 1000
    );

}


/* Initial flowers */

for (
    let i = 0;
    i < 12;
    i++
) {

    setTimeout(
        createFlower,
        i * 250
    );

}


/* Continuous flowers */

setInterval(
    createFlower,
    450
);


/* =====================================================
   SORRY CAT
===================================================== */

function openSorryPage() {

    window.location.href =
        "sorry.html";

}

</script>


</body>
</html>
